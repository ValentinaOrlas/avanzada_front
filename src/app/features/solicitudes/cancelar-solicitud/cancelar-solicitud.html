<p-dialog
  header="Cancelar Solicitud"
  [(visible)]="display"
  [modal]="true"
  [style]="{ width: '450px' }"
  (onHide)="cerrar()"
  [draggable]="false">

  <div *ngIf="solicitud">
    <div class="mb-3 p-3 border-round" style="background: #fff3cd; border: 1px solid #ffc107;">
      <i class="pi pi-exclamation-triangle text-orange-500 mr-2"></i>
      <span class="text-sm font-bold text-orange-700">
        Esta acción no se puede deshacer
      </span>
    </div>

    <div class="mb-3 p-3 border-round" style="background: #f8f9fa; border: 1px solid #e5e7eb;">
      <span class="text-sm text-600">Solicitud: </span>
      <span class="text-sm font-bold">{{ solicitud.codigo | slice:0:8 }}...</span>
      <span class="text-sm text-600 ml-3">Tipo: </span>
      <span class="text-sm font-bold">{{ solicitud.tipoNombre?.replace('_', ' ') }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">

      <div class="flex flex-column gap-2">
        <label class="font-bold">Motivo de Cancelación <span class="text-red-500">*</span></label>
        <textarea
          pTextarea
          formControlName="motivo"
          rows="4"
          class="w-full"
          placeholder="Explica el motivo de la cancelación...">
        </textarea>
        <small *ngIf="form.get('motivo')?.invalid && form.get('motivo')?.touched" class="text-red-500">
          El motivo es obligatorio (mín. 10 caracteres)
        </small>
      </div>

      <div class="flex justify-content-end gap-2 mt-2">
        <p-button
          label="Volver"
          icon="pi pi-times"
          styleClass="p-button-outlined p-button-secondary"
          type="button"
          (onClick)="cerrar()">
        </p-button>
        <p-button
          label="Cancelar Solicitud"
          icon="pi pi-ban"
          styleClass="p-button-danger"
          type="submit"
          [loading]="enviando"
          [disabled]="form.invalid || enviando">
        </p-button>
      </div>

    </form>
  </div>
</p-dialog>
