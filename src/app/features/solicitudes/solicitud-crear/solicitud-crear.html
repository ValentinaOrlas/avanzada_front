<div class="container py-5">
  
  <div class="card card-solicitud overflow-hidden mb-5">
    <div class="row g-0">
      
      <div class="col-lg-4 bg-dental-blue p-5 text-white d-none d-lg-flex flex-column justify-content-center">
        <i class="pi pi-shield mb-4" style="font-size: 3rem"></i>
        <h2 class="fw-bold">Gestión de Salud</h2>
        <p class="opacity-75">Registre su solicitud detalladamente. Nuestro sistema de IA le ayudará a categorizar su trámite de forma automática.</p>
        <div class="mt-4">
            <small class="d-block mb-2"><i class="pi pi-check-circle me-2"></i> Procesamiento seguro</small>
            <small class="d-block"><i class="pi pi-clock me-2"></i> Respuesta en menos de 24h</small>
        </div>
      </div>

      <div class="col-lg-8 p-4 p-md-5 bg-white">
        <div class="d-flex align-items-center mb-4">
            <h3 class="fw-bold text-dental-blue m-0">Crear Nueva Solicitud</h3>
        </div>
        
        <form [formGroup]="solicitudForm" (ngSubmit)="onSubmit()" class="row g-3">
          
          <div class="col-12 mb-3">
            <label class="form-label fw-semibold text-secondary">Tipo de Trámite</label>
            <p-select
              [options]="tipos"
              formControlName="tipoSolicitud"
              optionLabel="label"
              optionValue="value"
              placeholder="Seleccione el tipo de atención"
              styleClass="w-100">
            </p-select>
          </div>

          <div class="col-12 mb-3">
            <label class="form-label fw-semibold text-secondary">Descripción (Mínimo 20 caracteres)</label>
            <textarea
              pTextarea
              formControlName="descripcion"
              rows="5"
              class="form-control"
              placeholder="Describa su situación aquí...">
            </textarea>

            <div class="mt-3 d-flex align-items-center flex-wrap gap-3">
              <p-button
                label="Sugerir con IA"
                icon="pi pi-sparkles"
                type="button"
                severity="secondary"
                [outlined]="true"
                [loading]="analizando"
                (onClick)="sugerirTramite()">
              </p-button>

              <span *ngIf="sugerencia" class="badge bg-info-subtle text-primary border border-info-subtle p-2">
                <i class="pi pi-lightbulb me-1"></i> Sugerencia: {{ sugerencia }}
              </span>
            </div>
          </div>

          <div class="col-12 text-end mt-4">
            <p-button
              label="Enviar Solicitud"
              icon="pi pi-check"
              type="submit"
              [loading]="enviando"
              [disabled]="solicitudForm.invalid || enviando"
              styleClass="px-5 py-2">
            </p-button>
          </div>

        </form>
      </div>
    </div>
  </div>


</div>
