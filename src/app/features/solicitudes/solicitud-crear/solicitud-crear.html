<p-card header="Nueva Solicitud Académica">
  <form [formGroup]="solicitudForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
    
    <!-- DESCRIPCIÓN PRIMERO para que la IA la analice -->
    <div class="flex flex-column gap-2">
      <label for="desc" class="font-bold">Descripción del caso</label>
      <textarea 
        id="desc"
        pTextarea 
        formControlName="descripcion" 
        rows="4" 
        class="w-full"
        placeholder="Describe tu situación y la IA te sugerirá el tipo de trámite...">
      </textarea>

      <!-- BOTÓN IA -->
      <div class="flex align-items-center gap-2 mt-1">
        <p-button 
          label="Sugerir trámite con IA" 
          icon="pi pi-sparkles"
          styleClass="p-button-outlined p-button-sm"
          type="button"
          [loading]="analizando"
          [disabled]="(solicitudForm.get('descripcion')?.value?.length ?? 0) < 20 || analizando"
          (onClick)="sugerirTramite()">
        </p-button>
        <span *ngIf="sugerencia" class="text-sm text-green-600">
          <i class="pi pi-check-circle mr-1"></i>{{ sugerencia }}
        </span>
      </div>
    </div>

    <!-- TIPO DE TRÁMITE -->
    <div class="flex flex-column gap-2">
      <label for="tipo" class="font-bold">Tipo de Trámite</label>
      <p-select 
        id="tipo"
        [options]="tipos" 
        formControlName="tipoSolicitud" 
        optionLabel="label" 
        optionValue="value" 
        placeholder="Seleccione un trámite"
        styleClass="w-full">
      </p-select>
    </div>

    <div class="flex justify-content-end">
      <p-button 
        label="Registrar Solicitud" 
        icon="pi pi-send" 
        [disabled]="solicitudForm.invalid"
        type="submit">
      </p-button>
    </div>
  </form>
</p-card>
