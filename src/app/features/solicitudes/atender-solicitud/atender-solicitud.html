<p-dialog
  header="Atender Solicitud"
  [(visible)]="display"
  [modal]="true"
  [style]="{ width: '450px' }"
  (onHide)="cerrar()"
  [draggable]="false">

  <div *ngIf="solicitud">
    <div class="mb-3 p-3 border-round" style="background: #f0f7ff; border: 1px solid #bfdbfe;">
      <span class="text-sm text-600">Solicitud: </span>
      <span class="text-sm font-bold">{{ solicitud.codigo | slice:0:8 }}...</span>
      <span class="text-sm text-600 ml-3">Estado: </span>
      <span class="text-sm font-bold">{{ solicitud.estado }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">

      <div class="flex flex-column gap-2">
        <label class="font-bold">Observación <span class="text-red-500">*</span></label>
        <textarea
          pTextarea
          formControlName="observacion"
          rows="4"
          class="w-full"
          placeholder="Describe cómo fue atendida la solicitud...">
        </textarea>
        <small *ngIf="form.get('observacion')?.invalid && form.get('observacion')?.touched" class="text-red-500">
          La observación es obligatoria (mín. 10 caracteres)
        </small>
      </div>

      <div class="flex justify-content-end gap-2 mt-2">
        <p-button
          label="Cancelar"
          icon="pi pi-times"
          styleClass="p-button-outlined p-button-secondary"
          type="button"
          (onClick)="cerrar()">
        </p-button>
        <p-button
          label="Marcar como Atendida"
          icon="pi pi-check-circle"
          type="submit"
          [loading]="enviando"
          [disabled]="form.invalid || enviando">
        </p-button>
      </div>

    </form>
  </div>
</p-dialog>
