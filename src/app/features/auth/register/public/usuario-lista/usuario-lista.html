<div class="lista-container">
  <p-card>
    <ng-template pTemplate="header">
      <div class="card-header-custom">
        <div class="header-left">
          <i class="pi pi-users"></i>
          <span>Gestión de Usuarios</span>
        </div>
        <p-button
          label="Nuevo Personal"
          icon="pi pi-user-plus"
          styleClass="p-button-sm"
          (onClick)="irACrearPersonal()">
        </p-button>
      </div>
    </ng-template>

    <p-table
      [value]="usuarios"
      [rows]="10"
      [paginator]="true"
      [loading]="cargando"
      responsiveLayout="scroll"
      styleClass="p-datatable-sm p-datatable-striped">

      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th>Identificación</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Estado</th>
          <th style="width: 100px">Acción</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-u>
        <tr>
          <td class="font-bold">{{ u.nombre }}</td>
          <td class="text-500 text-sm">{{ u.identificacion }}</td>
          <td class="text-sm">{{ u.email }}</td>
          <td>
            <p-tag
              [value]="u.tipoUsuario"
              [severity]="getRolSeverity(u.tipoUsuario)">
            </p-tag>
          </td>
          <td>
            <p-tag
              [value]="u.activo ? 'ACTIVO' : 'INACTIVO'"
              [severity]="u.activo ? 'success' : 'secondary'">
            </p-tag>
          </td>
          <td>
            <p-button
              *ngIf="u.activo"
              icon="pi pi-ban"
              styleClass="p-button-text p-button-rounded p-button-danger"
              pTooltip="Desactivar usuario"
              (onClick)="desactivar(u)">
            </p-button>
            <span *ngIf="!u.activo" class="text-500 text-sm">—</span>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center p-4 text-500">
            No hay usuarios registrados.
          </td>
        </tr>
      </ng-template>

    </p-table>
  </p-card>
</div>
