<div class="admin-container">
  <p-card>
    <ng-template pTemplate="header">
      <div class="card-header-custom">
        <i class="pi pi-user-plus"></i>
        <span>Registrar Nuevo Personal</span>
      </div>
    </ng-template>

    <form [formGroup]="personalForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">

      <div class="grid">
        <!-- TIPO DOCUMENTO -->
        <div class="col-12 md:col-6 flex flex-column gap-2">
          <label class="font-bold">Tipo de Documento</label>
          <p-select
            [options]="tiposDocumento"
            formControlName="tipoDocumento"
            placeholder="Selecciona tipo"
            styleClass="w-full">
          </p-select>
        </div>

        <!-- IDENTIFICACIÓN -->
        <div class="col-12 md:col-6 flex flex-column gap-2">
          <label class="font-bold">Número de Identificación</label>
          <input 
            pInputText 
            formControlName="identificacion" 
            placeholder="Ej: 1004798832"
            class="w-full">
        </div>

        <!-- NOMBRE -->
        <div class="col-12 flex flex-column gap-2">
          <label class="font-bold">Nombre Completo</label>
          <input 
            pInputText 
            formControlName="nombre" 
            placeholder="Nombre completo"
            class="w-full">
        </div>

        <!-- EMAIL -->
        <div class="col-12 flex flex-column gap-2">
          <label class="font-bold">Correo Electrónico</label>
          <input 
            pInputText 
            type="email"
            formControlName="email" 
            placeholder="correo@uniquindio.edu.co"
            class="w-full">
        </div>

        <!-- ROL -->
        <div class="col-12 md:col-6 flex flex-column gap-2">
          <label class="font-bold">Cargo / Rol</label>
          <p-select
            [options]="rolesOpciones"
            formControlName="tipoUsuario"
            optionLabel="label"
            optionValue="value"
            placeholder="Selecciona rol"
            styleClass="w-full">
          </p-select>
        </div>

        <!-- CONTRASEÑA -->
        <div class="col-12 md:col-6 flex flex-column gap-2">
          <label class="font-bold">Contraseña Temporal</label>
          <p-password
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
            styleClass="w-full"
            [feedback]="false"
            [toggleMask]="true">
          </p-password>
        </div>
      </div>

      <div class="flex justify-content-end gap-2 mt-3">
        <p-button 
          label="Cancelar" 
          icon="pi pi-times"
          styleClass="p-button-outlined p-button-secondary"
          type="button"
          (onClick)="cancelar()">
        </p-button>
        <p-button 
          label="Crear Personal" 
          icon="pi pi-check"
          [disabled]="personalForm.invalid || enviando"
          [loading]="enviando"
          type="submit">
        </p-button>
      </div>

    </form>
  </p-card>
</div>
