<div class="inicio-container">

  <!-- BANNER -->
  <div class="banner-wrapper">
    <img src="./assets/imagenSolcitud.png" alt="Portal" class="banner-img">
    <div class="banner-overlay">
      <div class="banner-content">
        <span class="banner-eyebrow">Portal Académico Digital</span>
        <h1 class="banner-title">Sistema de Solicitudes Academicas</h1>
        <p class="banner-subtitle">Gestión ágil y transparente de solicitudes universitarias</p>
      </div>
    </div>
  </div>

  <!-- CARDS MISIÓN Y VISIÓN -->
  <section class="pilares-section">
    <p class="pilares-eyebrow">Nuestros pilares institucionales</p>
    <div class="pilares-grid">
      @for (pilar of pilares(); track pilar.titulo) {
        <div class="pilar-card" [class]="'pilar-' + pilar.color">
          <div class="pilar-accent"></div>
          <div class="pilar-icon-wrap" [class]="'icon-' + pilar.color">
            <i [class]="'pi ' + pilar.icono"></i>
          </div>
          <h3 class="pilar-titulo">{{ pilar.titulo }}</h3>
          <p class="pilar-desc">{{ pilar.descripcion }}</p>
        </div>
      }
    </div>
  </section>

</div>
